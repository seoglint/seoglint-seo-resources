<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Title: unique per page, describes the page first and the brand last -->
  <title>How to Write a robots.txt File | Example Co</title>

  <!-- Description: a clear summary; Google may rewrite it -->
  <meta name="description" content="Learn how to write, test, and deploy a robots.txt file, including rules for search crawlers and AI crawlers.">

  <!-- Canonical: the preferred, absolute URL of this page -->
  <link rel="canonical" href="https://www.example.com/guides/robots-txt">

  <!-- Robots: only needed when you want something other than the default -->
  <meta name="robots" content="index, follow, max-image-preview:large">

  <!-- Open Graph: used by social networks and many link previews -->
  <meta property="og:type" content="article">
  <meta property="og:title" content="How to Write a robots.txt File">
  <meta property="og:description" content="Write, test, and deploy robots.txt, including rules for AI crawlers.">
  <meta property="og:url" content="https://www.example.com/guides/robots-txt">
  <meta property="og:image" content="https://www.example.com/images/robots-txt-guide-1200x630.jpg">
  <meta property="og:site_name" content="Example Co">

  <!-- X (Twitter) card -->
  <meta name="twitter:card" content="summary_large_image">

  <!-- Language alternates: include only if translated versions exist -->
  <link rel="alternate" hreflang="en" href="https://www.example.com/guides/robots-txt">
  <link rel="alternate" hreflang="x-default" href="https://www.example.com/guides/robots-txt">

  <!-- Structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Article",
    "headline": "How to Write a robots.txt File",
    "datePublished": "2026-11-01T09:00:00+05:00",
    "author": { "@type": "Person", "name": "Jane Example" }
  }
  </script>
</head>
<body>
  <h1>How to Write a robots.txt File</h1>
  <p>Page content goes here.</p>
</body>
</html>
